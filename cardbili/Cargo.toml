[package]
name = "cardbili"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "Bilibili client for the Linux-based Cardputer Zero"
default-run = "cardbili"

[build-dependencies]
slint-build = "~1.8"
fontdue = "0.9"
ttf-parser = "0.21"
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }

[features]
desktop = ["dep:minifb"]

[dependencies]
slint = { version = "~1.8", default-features = false, features = ["std", "renderer-software", "compat-1-2"] }
i-slint-core = { version = "=1.8.0", default-features = false, features = ["std"] }
minifb = { version = "0.27", optional = true }
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
qrcodegen = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
libc = "0.2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "cookies"] }
chacha20poly1305 = "0.10"
getrandom = "0.2"
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
brotli = "8"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "off"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
cpal = "0.15"

[dev-dependencies]
tempfile = "3"
