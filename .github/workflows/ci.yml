name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
          rustup toolchain install stable --profile minimal
          rustup override set stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: cardbili -> target
          key: checks
      - name: Check desktop build
        working-directory: cardbili
        run: cargo check --locked --features desktop
      - name: Run unit tests
        working-directory: cardbili
        run: |
          cargo test --locked
          cargo test --locked --features desktop
      - name: Check scripts, metadata and secrets
        run: bash scripts/check.sh

  device:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm python3-pil dpkg
          rustup toolchain install stable --profile minimal --target aarch64-unknown-linux-musl
          rustup override set stable
          rustup component add rust-docs
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: cardbili -> target
          key: device
      - name: Build device binaries
        run: bash scripts/build-device.sh
      - name: Package binaries and corresponding source
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python3 scripts/package-release.py
      - name: Validate Debian package and corresponding source
        run: |
          python3 scripts/check-release.py --deb dist/cardbili_*_arm64.deb
          python3 .agents/skills/cardputer-app-publish/scripts/prepublish_check.py \
            --deb dist/cardbili_*_arm64.deb --app-dir .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cardbili-device
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/cardbili_*_arm64.deb
            dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: cardbili-source
          if-no-files-found: error
          retention-days: 1
          path: dist/cardbili-*-source.tar.gz

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary: cardbili
            upx: true
          - os: macos-15
            name: macos-arm64
            target: aarch64-apple-darwin
            binary: cardbili
            upx: false
          - os: windows-latest
            name: windows-x86_64
            target: x86_64-pc-windows-msvc
            binary: cardbili.exe
            upx: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential upx-ucl pkg-config libx11-dev libxkbcommon-dev libxcursor-dev libxrandr-dev libxi-dev
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup override set stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: cardbili -> target
          key: ${{ matrix.target }}
      - name: Run desktop unit tests
        if: runner.os != 'Linux'
        working-directory: cardbili
        run: cargo test --locked --features desktop --target ${{ matrix.target }}
      - name: Build desktop binary
        working-directory: cardbili
        run: cargo build --release --locked --features desktop --target ${{ matrix.target }}
      - name: Install UPX (Windows)
        if: matrix.upx && runner.os == 'Windows'
        run: choco install upx --no-progress -y
      - name: Compress binary with UPX
        if: matrix.upx
        run: upx --best --lzma "cardbili/target/${{ matrix.target }}/release/${{ matrix.binary }}"
      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/package-desktop.sh "${{ matrix.name }}" "${{ matrix.target }}" "${{ matrix.binary }}"
      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "cardbili/target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/cardbili-desktop-${{ matrix.name }}.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cardbili-desktop-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: dist/cardbili-desktop-${{ matrix.name }}*

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [checks, device, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cardbili-*
          merge-multiple: true
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum -c SHA256SUMS
          sha256sum cardbili-desktop-* >> SHA256SUMS
          gh release create "$RELEASE_TAG" \
            --verify-tag --title "$RELEASE_TAG" --generate-notes \
            cardbili_*_arm64.deb cardbili-*-source.tar.gz \
            cardbili-desktop-* SHA256SUMS

  store:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/publish-store.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      CARDPUTER_STORE_TOKEN: ${{ secrets.CARDPUTER_STORE_TOKEN }}
